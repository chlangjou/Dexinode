id: gate-b-orchestration-v1
title: Orchestration Advantage
owner: human
executor: agent
status: active
active_stage: B1R2-oracle-and-semantic-contract-remediation

precondition:
  gate_a_final_decision: PASS
  gate_a_decision_record: gates/gate-a-specialization/reviews/gate-a-final-human-decision.md

objective: >-
  Determine whether an evidence-based skill router can turn validated specialist
  capability into a measurable mixed-workload advantage over a General-only
  policy without increasing logical model calls per task.

bounded_hypothesis: >-
  On a structurally fresh 96-case mixed mathematics/software-coding benchmark,
  a frozen deterministic semantic-task-only router using the Gate A empirical
  capability registry improves overall semantic accuracy by at least 10
  percentage points over General-only, with paired-bootstrap 95% confidence
  interval excluding zero, while each logical policy uses exactly one model
  inference per task.

empirical_skill_registry:
  mathematics:
    model_id: Qwen/Qwen2.5-Math-7B-Instruct
    revision: ef9926d75ab1d54532f6a30dd5e760355eb9aa4d
    gate_a_status: validated_specialist
  software_coding:
    model_id: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28
    gate_a_status: best_validated_route_for_initial_gate_b
  fallback:
    model_id: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28

human_review:
  b1_v1_0_0:
    reviewed_commit: 7228c973130ed6032226118873a140927c48f17f
    decision: CHANGES_REQUIRED
    review_record: gates/gate-b-orchestration/reviews/b1-v1.0.0-human-review.md
    blockers: [structural_freshness, router_handoff_contract_cues]
  b1r_v1_1_0:
    reviewed_commit: 48d768799bba4d5f3862359eddeb44cf134a962e
    benchmark_version: gate-b-orchestration-v1.1.0
    router: router-v2
    decision: CHANGES_REQUIRED
    review_record: gates/gate-b-orchestration/reviews/b1r-v1.1.0-human-review.md
    accepted_components:
      structural_freshness: true
      router_information_boundary: true
      balanced_96_case_design: true
      semantic_adapter: true
      execution_sequence: true
      token_context_controls: true
      candidate_revisions: true
      inference_controls: true
      acceptance_thresholds: true
    blocking_findings:
      math_oracle_errors: [math-14, math-37]
      coding_prompt_evaluator_semantic_contract_defects: true
    B2_authorized: false
    selected_model_execution_authorized: false

constraints:
  training_allowed: false
  fine_tuning_allowed: false
  model_merging_allowed: false
  llm_router_allowed: false
  deterministic_cpu_router_only: true
  router_semantic_task_text_only: true
  handoff_output_contract_visible_to_router: false
  logical_model_calls_per_case: 1
  fallback_second_model_call_allowed: false
  ensemble_allowed: false
  voting_allowed: false
  external_tools_allowed: false
  gate_b_selected_model_execution_allowed: false
  final_gate_decision_by_agent: false

stages:
  B1-protocol-router-benchmark-freeze:
    status: frozen-not-approved
    benchmark_version: gate-b-orchestration-v1.0.0
    benchmark_root: experiments/gate-b/benchmark-v1.0.0/
    router_root: experiments/gate-b/router-v1/
    reviewed_commit: 7228c973130ed6032226118873a140927c48f17f
    review_record: gates/gate-b-orchestration/reviews/b1-v1.0.0-human-review.md
    preserve_unchanged: true

  B1R-structural-freshness-and-router-boundary-revision:
    status: frozen-not-approved-benchmark-definition-errors
    benchmark_version: gate-b-orchestration-v1.1.0
    benchmark_root: experiments/gate-b/benchmark-v1.1.0/
    router_root: experiments/gate-b/router-v2/
    reviewed_commit: 48d768799bba4d5f3862359eddeb44cf134a962e
    review_record: gates/gate-b-orchestration/reviews/b1r-v1.1.0-human-review.md
    preserve_unchanged: true
    structural_freshness_accepted: true
    router_information_boundary_accepted: true
    known_math_oracle_errors:
      math-14: {frozen: 64, corrected: 136}
      math-37: {frozen: "41/9", corrected: "161/36"}

  B1R2-oracle-and-semantic-contract-remediation:
    status: completed-pending-human-review
    target_benchmark_version: gate-b-orchestration-v1.1.1
    target_root: experiments/gate-b/benchmark-v1.1.1/
    objective: >-
      Preserve the accepted v1.1.0 structural freshness, router boundary,
      execution controls and thresholds while correcting Math oracle errors and
      completing a 48/48 Coding prompt-to-evaluator semantic-contract audit.
    requirements:
      preserve_v1_0_0_and_v1_1_0_unchanged: true
      preserve_structural_case_constructions_where_possible: true
      preserve_router_v2_semantics_unless_spec_wording_requires_revision: true
      correct_math_14_to: 136
      correct_math_37_to: "161/36"
      complete_48_math_oracle_recomputation: required
      complete_48_coding_prompt_evaluator_semantic_contract_audit: required
      complete_coding_reference_evaluator_validation: required
      known_coding_spec_items_to_review: [code-02, code-09, code-21, code-38, code-42]
      adapter_behavior_unchanged: true
      token_context_validation: required
      manifest_hash_refresh: required
      acceptance_thresholds_unchanged: true
      selected_model_execution: false
      stop_for_human_review: true
    execution_plan_to_preserve:
      one_orchestrated_sequence: true
      result_review_between_general_and_specialist_collection: false
      general_inference: all_96_once
      specialist_inference: frozen_router_selected_cases_only
      reuse_general_outputs_when_treatment_routes_general: true
      compose_routed_policy_from_frozen_route_decisions: true
      protocol_change_after_first_selected_model_output: forbidden
    completion:
      benchmark_frozen: true
      benchmark_manifest: experiments/gate-b/benchmark-v1.1.1/manifest.yaml
      prior_benchmarks_unchanged: true
      math_oracle_validation: "48/48 PASS"
      coding_evaluator_validation: "48/48 PASS"
      coding_semantic_contract_audit: "48/48 PASS"
      known_math_corrections: {math-14: 136, math-37: "161/36"}
      adapter_tests: "13/13 PASS"
      router_tests: "5/5 PASS; target routes 96/96"
      token_context_validation: "96/96 PASS; max input 124; context margin 2948"
      selected_model_execution: false
      human_review_required: true

  B2-router-static-qualification:
    status: inactive
    activation: human_approval_after_B1R2
    objective: >-
      Confirm final frozen benchmark correctness, structural freshness, router
      information boundary and execution/resource invariants without selected-model execution.

  B3B4-comparable-policy-execution:
    status: inactive
    activation: human_approval_after_B2
    objective: >-
      Execute the frozen General evidence and specialist-selected evidence in
      one orchestrated sequence with no between-phase result inspection, then
      compose General-only and skill-routed policy rows from preserved outputs.

  B5-evidence-report:
    status: inactive
    objective: >-
      Compute paired uncertainty, routing accuracy, domain/task-family effects,
      resource parity and a Gate B recommendation without assigning the final decision.

acceptance_reference: gates/gate-b-orchestration/acceptance.yaml

forbidden_actions_during_B1R2:
  - execute_general_checkpoint_for_gate_b
  - execute_math_checkpoint_for_gate_b
  - execute_coder_checkpoint_for_gate_b
  - inspect_selected_model_gate_b_outputs
  - use_gate_a_case_specific_wins_or_losses_to_tune_cases
  - use_gate_a_retrospective_coder_postmortem_to_tune_cases
  - expose_handoff_output_contract_or_hidden_metadata_to_router
  - modify_gate_b_acceptance_thresholds
  - patch_v1_0_0_or_v1_1_0_in_place
  - broaden_to_multi_step_agent_collaboration

handoff:
  durable_state: git
  final_decision: human_review
  next_action: human_review_of_B1R2_then_explicit_authorization_for_B2
