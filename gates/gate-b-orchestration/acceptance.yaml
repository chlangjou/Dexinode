id: gate-b-orchestration-acceptance-v1
status: evaluated-final
final_decision_owner: human
final_human_decision: FAIL
final_decision_record: gates/gate-b-orchestration/reviews/gate-b-final-human-decision.md
thresholds_changed_from_initial_proposal: false

benchmark:
  version: gate-b-orchestration-v1.1.1
  root: experiments/gate-b/benchmark-v1.1.1/
  router: experiments/gate-b/router-v2/router.py
  B1R2_review: gates/gate-b-orchestration/reviews/b1r2-v1.1.1-human-review.md
  B2_qualification: gates/gate-b-orchestration/reviews/b2-static-qualification.md
  B3B4_review: gates/gate-b-orchestration/reviews/b3b4-v1.1.1-human-review.md
  evidence_report: gates/gate-b-orchestration/evidence-report.md

question: >-
  Does a frozen evidence-based semantic-task router improve structurally fresh
  mixed-workload semantic accuracy relative to a General-only policy when both
  logical policies use exactly one model inference per task and the same
  generation budget?

primary_orchestration_signal:
  metric: overall_semantic_accuracy_delta_routed_minus_general
  minimum_absolute_improvement_percentage_points: 10
  uncertainty_requirement:
    method: paired_bootstrap
    confidence_level: 0.95
    resamples: 20000
    seed: 0
    improvement_interval_must_exclude_zero: true

validated_skill_signal:
  mathematics_routed_minus_general:
    minimum_absolute_improvement_percentage_points: 10
    paired_bootstrap_interval_must_exclude_zero: true

non_target_protection:
  software_coding_routed_minus_general:
    maximum_allowed_degradation_percentage_points: 5

router_quality:
  minimum_domain_routing_accuracy: 0.95

observed_execution:
  execution_id: gate-b-b3b4-v1.1.1-20260810T014247Z-ai01-gpu0
  evidence_root: experiments/gate-b/runs/gate-b-b3b4-v1.1.1-20260810T014247Z-ai01-gpu0/
  general_only: {overall: 76/96, mathematics: 40/48, coding: 36/48}
  skill_routed: {overall: 77/96, mathematics: 41/48, coding: 36/48}
  overall_delta_percentage_points: 1.0416666666666665
  overall_ci95_percentage_points: [0.0, 3.125]
  mathematics_delta_percentage_points: 2.083333333333333
  mathematics_ci95_percentage_points: [0.0, 6.25]
  coding_delta_percentage_points: 0.0
  router_accuracy: 1.0
  coder_executed: false
  generation_failures: 0
  coding_judge_infrastructure_failures: 0
  coding_judge_timeouts: 0

criterion_evaluation:
  minimum_evidence_satisfied: true
  freshness_and_leakage_controls_satisfied: true
  router_information_boundary_satisfied: true
  resource_parity_satisfied: true
  execution_freeze_satisfied: true
  router_quality_satisfied: true
  non_target_protection_satisfied: true
  primary_orchestration_signal_satisfied: false
  validated_math_skill_signal_satisfied: false
  no_unresolved_material_methodological_defect: true

final_evaluation:
  label: FAIL
  reason: >-
    The valid comparable fresh execution did not meet the frozen overall or
    Mathematics improvement thresholds, and both improvement confidence
    intervals include zero. The fail conditions are satisfied and no material
    inconclusive condition remains.

closure:
  additional_gate_b_selected_model_execution_authorized: false
  gate_b_v1_closed: true
