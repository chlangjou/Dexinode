id: gate-a-specialization-v1
title: Specialist Validation
owner: human
executor: agent
status: active
active_stage: A5R1-interface-protocol-and-benchmark-freeze

objective: >-
  Determine whether existing specialist model checkpoints exhibit reproducible,
  measurable specialization relative to a closely related general-purpose baseline.

constraints:
  existing_models_only: true
  fine_tuning_allowed: false
  training_allowed: false
  model_merging_allowed: false
  orchestration_allowed: false
  routing_allowed: false
  networking_required: false
  final_gate_decision_by_agent: false

candidate_requirements:
  minimum_general_models: 1
  minimum_specialist_models: 2
  minimum_skill_domains: 2
  same_family_preferred: true
  same_generation_preferred: true
  similar_parameter_scale_preferred: true
  public_checkpoint_required: true
  usable_license_required: true
  runtime_feasibility_required: true

selected_candidates:
  general:
    id: Qwen/Qwen2.5-7B-Instruct
    revision: a09a35458c702b33eeacc393d103063234e8bc28
  mathematics_specialist:
    id: Qwen/Qwen2.5-Math-7B-Instruct
    revision: ef9926d75ab1d54532f6a30dd5e760355eb9aa4d
  software_coding_specialist:
    id: Qwen/Qwen2.5-Coder-7B-Instruct
    revision: c03e6d358207e414f1eca0bb1891e29f1db0e242

stages:
  A1-candidate-scout:
    status: completed

  A2-candidate-eligibility:
    status: approved
    human_review_record: gates/gate-a-specialization/reviews/a2-human-review.md

  A3-benchmark-freeze:
    status: approved-historical-v1.1
    benchmark_version: gate-a-cross-skill-v1.1.0
    benchmark_root: experiments/gate-a/benchmark-v1.1.0/
    human_review_record: gates/gate-a-specialization/reviews/a3-human-review-v1.1.md

  A4-general-baseline:
    status: approved-historical-v1.1
    run_id: a4-general-baseline-20260809T082430Z-ai01-gpu0
    evidence_root: experiments/gate-a/runs/a4-general-baseline-20260809T082430Z-ai01-gpu0/
    human_review_record: gates/gate-a-specialization/reviews/a4b-general-baseline-human-review.md
    strict_v1_1_metrics:
      mathematics_accuracy: 0.2083333333
      software_coding_accuracy: 0.75
      overall_accuracy: 0.4791666667

  A5-specialist-cross-evaluation:
    status: completed-reviewed-interface-confounded
    benchmark_version: gate-a-cross-skill-v1.1.0
    reviewed_commit: c95da721f0e55e0bda1c55f3dee9f4c95c814034
    human_review_record: gates/gate-a-specialization/reviews/a5-interface-confounder-human-review.md
    capability_matrix_accepted: false
    A6_authorized: false
    strict_interface_execution_records:
      mathematics_specialist:
        run_id: a5-math-specialist-20260809T092120Z-ai01-gpu0
        evidence_root: experiments/gate-a/runs/a5-math-specialist-20260809T092120Z-ai01-gpu0/
        mathematics_accuracy: 0.0
        software_coding_accuracy: 0.0
        overall_accuracy: 0.0
        interpretation: output_interface_confounded_not_capability_zero
      software_coding_specialist:
        run_id: a5-coder-specialist-20260809T092120Z-ai01-gpu0
        evidence_root: experiments/gate-a/runs/a5-coder-specialist-20260809T092120Z-ai01-gpu0/
        mathematics_accuracy: 0.25
        software_coding_accuracy: 0.8125
        overall_accuracy: 0.53125
      general_reference:
        run_id: a4-general-baseline-20260809T082430Z-ai01-gpu0
        mathematics_accuracy: 0.2083333333
        software_coding_accuracy: 0.75
        overall_accuracy: 0.4791666667
    confirmed_confounder:
      A2_identified_math_template_difference: true
      common_neutral_template_was_insufficient: true
      mathematics_boxed_answer_behavior: true
      coding_prose_and_multiple_block_behavior: true
      strict_wire_format_conflated_with_task_competence: true

  A5R1-interface-protocol-and-benchmark-freeze:
    status: completed-frozen-pending-human-review
    activation: human_approved_after_A5_interface_review
    contract: gates/gate-a-specialization/execution/a5r-interface-remediation.yaml
    objective: >-
      Build and freeze fresh v1.2 cases plus one common model-agnostic semantic
      handoff/normalization contract before executing any selected model.
    target_benchmark_version: gate-a-cross-skill-v1.2.0
    target_benchmark_root: experiments/gate-a/benchmark-v1.2.0/
    completed_artifacts:
      manifest: experiments/gate-a/benchmark-v1.2.0/manifest.yaml
      adapter_tests: experiments/gate-a/benchmark-v1.2.0/adapter/test_adapter.py
      token_counts: experiments/gate-a/benchmark-v1.2.0/token_counts.yaml
      validation: "13 synthetic adapter tests passed; all 96 rendered inputs plus 1024 generation tokens fit the 4096-token envelope."
    selected_model_execution_allowed: false
    use_selected_model_outputs_for_adapter_tests: false
    synthetic_adapter_fixtures_only: true
    acceptance_criteria_unchanged: true
    required_case_counts: {mathematics: 48, software_coding: 48}
    required_difficulty_counts_per_domain: {foundational: 10, intermediate: 24, advanced: 14}
    required_controls:
      fresh_case_instances: true
      common_neutral_chat_envelope: true
      common_model_agnostic_output_contract: true
      primary_semantic_score_separate_from_strict_interface_compliance: true
      deterministic_normalization: true
      llm_judge: false
      total_context_tokens: 4096
      checkpoint_dtype: bfloat16
      quantization: none
      external_tools: false
    forbidden_actions:
      - execute_general_model
      - execute_math_specialist
      - execute_coder_specialist
      - modify_v1_1_benchmark_or_runs
      - modify_gate_acceptance_criteria
      - change_candidate_set
      - use_model_specific_chat_template
      - tune_adapter_using_selected_model_outputs
      - proceed_to_A5R2_without_human_review
    completion_note: "v1.2.0 is frozen in Git; stop for human review before A5R2."
    stop_for_human_review: true

  A5R2-three-model-cross-evaluation:
    status: inactive
    activation: human_approval_after_A5R1
    objective: >-
      Execute General, Math specialist, and Coder specialist on the complete
      frozen v1.2 benchmark under one unchanged protocol without result review
      between model runs.

  A6-evidence-report:
    status: inactive
    objective: summarize evidence, uncertainty, specialization concentration, and a Gate recommendation without declaring the final Gate decision

approved_execution_environment_for_future_runs:
  host: ai01
  docker_engine: 29.5.3
  runtime: runc
  selected_gpu_uuid: GPU-e1760d1d-d9a5-29ce-32f0-bbd70bc98664
  selected_gpu_class: NVIDIA L40
  formal_inference_memory: 40g
  formal_inference_cpus: 16
  checkpoint_dtype: bfloat16
  quantization: none
  package_runtime_reference: experiments/gate-a/runs/a4-general-baseline-20260809T082430Z-ai01-gpu0/runtime-definition.json
  judge_v2_receipt: experiments/gate-a/execution/a4-docker-qualification/judge-isolation-preflight-v2.json

required_final_outputs:
  - experiments/gate-a/candidates.yaml
  - experiments/gate-a/benchmark-v1.2.0/manifest.yaml
  - experiments/gate-a/runs/
  - gates/gate-a-specialization/evidence-report.md

executor_permissions:
  research_candidates: false
  create_experiment_code: true
  modify_experiment_code: true
  modify_acceptance_criteria: false
  replace_baseline_after_execution: false
  declare_gate_pass: false
  declare_gate_fail: false

completion_states:
  - evidence_complete
  - blocked
  - inconclusive

handoff:
  durable_state: git
  status_file: status/current.md
  final_decision: human_review
