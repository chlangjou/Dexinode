interpretation:
  result_class: single-specialist-pass
  summary: >-
    Gate A demonstrates that a same-family specialist checkpoint can exhibit a
    large reproducible domain-specific advantage, but checkpoint labels are not
    themselves evidence of specialization. The Math checkpoint is validated;
    the Coder checkpoint did not demonstrate a coding advantage on this gate.
  architectural_consequence: >-
    Dexinode capability routing must use empirically measured skill profiles and
    explicit handoff contracts/adapters rather than trusting checkpoint names.

