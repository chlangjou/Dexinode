  - create_new_versioned_benchmark_directory
  - implement_deterministic_semantic_normalizer
  - implement_synthetic_adapter_tests
  - validate_token_counts
  - record_provenance_and_contamination_risks
  - freeze_v1_2_manifest

forbidden_actions_A5R1:
  - execute_general_model
  - execute_math_specialist
  - execute_coder_specialist
  - inspect_new_candidate_outputs
  - modify_v1_1_benchmark_or_runs
  - modify_gate_acceptance_criteria
  - change_candidate_set
  - use_model_specific_prompt_or_chat_template
  - tune_adapter_using_selected_model_outputs
  - proceed_to_A5R2_without_human_review

required_outputs_A5R1:
