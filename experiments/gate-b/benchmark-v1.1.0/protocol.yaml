sequence:
  - phase: route_freeze
    action: "Compute all 96 deterministic route decisions from semantic_task only; persist the receipt before the first selected-model response."
  - phase: general_baseline
    action: "Run Qwen/Qwen2.5-7B-Instruct once on all 96 cases in frozen order and preserve every response before any specialist phase."
  - phase: routed_specialist
    action: "Run the Mathematics specialist only for frozen mathematics_specialist routes; reuse preserved General responses for general_baseline routes."
  - phase: score
    action: "Apply the unchanged semantic adapter and coding judge-v2 policy to matched case IDs, then compute paired metrics."
controls:
