  selected_models: [Qwen/Qwen2.5-7B-Instruct, Qwen/Qwen2.5-Math-7B-Instruct]
  revisions: {general: a09a35458c702b33eeacc393d103063234e8bc28, mathematics: ef9926d75ab1d54532f6a30dd5e760355eb9aa4d}
