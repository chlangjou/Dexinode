  - {id: code-38, domain: software_coding, task_family: partition_product_dp, difficulty: advanced, semantic_task: "Implement maximize_partition_product(values, groups). Split values into exactly groups nonempty contiguous parts and maximize the sum, over parts, of the product of all elements in that part.", evaluator: {type: python_unit_tests, entrypoint: maximize_partition_product, tests: [{args: [[1, 2, 3], 2], expected: 7}, {args: [[5], 1], expected: 5}]}}
  - {id: code-39, domain: software_coding, task_family: polynomial_product, difficulty: advanced, semantic_task: "Implement multiply_polynomials(left, right), where coefficient lists are in ascending degree order. Return the product with trailing zero coefficients removed.", evaluator: {type: python_unit_tests, entrypoint: multiply_polynomials, tests: [{args: [[1, 2], [3, 4]], expected: [3, 10, 8]}, {args: [[0], [2, 0]], expected: [0]}]}}
  - {id: code-40, domain: software_coding, task_family: integer_linear_system, difficulty: advanced, semantic_task: "Implement solve_integer_pair(a,b,c,d,e,f) for the system ax+by=e and cx+dy=f. Return [x,y] only when the unique solution has integer coordinates; return None for a singular system or a nonintegral solution.", evaluator: {type: python_unit_tests, entrypoint: solve_integer_pair, tests: [{args: [2, 1, 1, -1, 7, 17], expected: [8, -9]}, {args: [1, 2, 2, 4, 3, 6], expected: null}]}}
  - {id: code-41, domain: software_coding, task_family: knight_reachability, difficulty: advanced, semantic_task: "Implement knight_reachable(rows, cols, start, goal, blocked). Coordinates are zero-based [row,column] in a rows-by-cols board; with unblocked start and goal, return whether a chess knight can reach goal without entering blocked cells.", evaluator: {type: python_unit_tests, entrypoint: knight_reachable, tests: [{args: [4, 4, [0, 0], [1, 2], []], expected: true}, {args: [3, 3, [0, 0], [1, 1], []], expected: false}]}}
  - {id: code-42, domain: software_coding, task_family: multiset_difference, difficulty: advanced, semantic_task: "Implement multiset_difference(text, remove). Consume the requested character counts from left to right in text, skipping exactly those consumed occurrences and preserving every other character; return None if remove requests a character too many times.", evaluator: {type: python_unit_tests, entrypoint: multiset_difference, tests: [{args: [banana, an], expected: bana}, {args: [abc, z], expected: null}]}}
  - {id: code-43, domain: software_coding, task_family: csv_projection, difficulty: advanced, semantic_task: "Implement project_csv(text, columns). Parse standard comma-separated text with a header and data rows; return one dictionary per data row using the requested header names in the requested order. Assume every requested column exists.", evaluator: {type: python_unit_tests, entrypoint: project_csv, tests: [{args: ["name,age\nAda,36\nLin,28", [age, name]], expected: [{age: "36", name: Ada}, {age: "28", name: Lin}]}, {args: ["a,b\n1,2", [b]], expected: [{b: "2"}]}]}}
