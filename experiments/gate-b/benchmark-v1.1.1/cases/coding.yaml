  - {id: code-32, domain: software_coding, task_family: tree_level_widths, difficulty: intermediate, semantic_task: "Implement tree_level_widths(tree) for a binary tree represented by [value,left,right], with None for absent children. Return a list of node counts at depths 0,1,...; return [] for None.", evaluator: {type: python_unit_tests, entrypoint: tree_level_widths, tests: [{args: [[a, [b, null, null], [c, [d, null, null], null]]], expected: [1, 2, 1]}, {args: [null], expected: []}]}}
  - {id: code-33, domain: software_coding, task_family: graph_two_coloring, difficulty: intermediate, semantic_task: "Implement can_two_color(nodes, edges). Treat edges as undirected and nodes as including isolated vertices; return true exactly when vertices can receive two colors with different colors on every edge.", evaluator: {type: python_unit_tests, entrypoint: can_two_color, tests: [{args: [[0, 1, 2], [[0, 1], [1, 2]]], expected: true}, {args: [[0, 1, 2], [[0, 1], [1, 2], [2, 0]]], expected: false}]}}
