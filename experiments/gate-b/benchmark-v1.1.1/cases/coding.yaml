  - {id: code-23, domain: software_coding, task_family: cyclic_difference, difficulty: intermediate, semantic_task: "Implement circular_differences(values). Return absolute differences of adjacent values, including the last-to-first pair; return an empty list for empty input.", evaluator: {type: python_unit_tests, entrypoint: circular_differences, tests: [{args: [[2, 7, 3]], expected: [5, 4, 1]}, {args: [[4]], expected: [0]}]}}
