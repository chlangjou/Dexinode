  - {id: code-16, domain: software_coding, task_family: weekday_index, difficulty: intermediate, semantic_task: "Implement weekday_index(year, month, day). Return the ISO weekday number from 1 for Monday through 7 for Sunday, using the proleptic Gregorian calendar.", evaluator: {type: python_unit_tests, entrypoint: weekday_index, tests: [{args: [2024, 1, 1], expected: 1}, {args: [2024, 2, 29], expected: 4}]}}
