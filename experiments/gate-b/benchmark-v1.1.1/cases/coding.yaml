  - {id: code-47, domain: software_coding, task_family: common_prefix, difficulty: advanced, semantic_task: "Implement common_prefix(words). Return the longest string that is a prefix of every word, preserving case; return an empty string for no words or no common character.", evaluator: {type: python_unit_tests, entrypoint: common_prefix, tests: [{args: [[flower, flow, flight]], expected: fl}, {args: [[dog, racecar]], expected: ""}]}}
  - {id: code-48, domain: software_coding, task_family: minimum_vertex_cover_tree, difficulty: advanced, semantic_task: "Implement tree_cover_size(nodes, edges). The undirected edges form a tree over nodes; return the minimum number of vertices whose selected set contains at least one endpoint of every edge.", evaluator: {type: python_unit_tests, entrypoint: tree_cover_size, tests: [{args: [[0, 1, 2, 3], [[0, 1], [1, 2], [1, 3]]], expected: 1}, {args: [[0, 1], [[0, 1]]], expected: 1}]}}
