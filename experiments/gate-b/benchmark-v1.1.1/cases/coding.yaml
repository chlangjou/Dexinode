cases:
  - {id: code-01, domain: software_coding, task_family: round_half_up, difficulty: foundational, semantic_task: "Implement round_half_up(value, step) for nonnegative integers. Return value rounded to the nearest multiple of positive step, with an exact halfway case rounded upward.", evaluator: {type: python_unit_tests, entrypoint: round_half_up, tests: [{args: [17, 5], expected: 15}, {args: [18, 5], expected: 20}, {args: [15, 5], expected: 15}]}}
  - {id: code-02, domain: software_coding, task_family: hex_color_validation, difficulty: foundational, semantic_task: "Implement is_hex_color(text). Return true only when text has seven characters total: # followed by exactly six hexadecimal digits (0-9, A-F, or a-f). Return false otherwise.", evaluator: {type: python_unit_tests, entrypoint: is_hex_color, tests: [{args: ["#A0c9FF"], expected: true}, {args: ["#12345"], expected: false}, {args: ["123456"], expected: false}]}}
  - {id: code-03, domain: software_coding, task_family: spreadsheet_label, difficulty: foundational, semantic_task: "Implement column_label(number) for a positive one-based column number, using letters in the same scheme as spreadsheet columns.", evaluator: {type: python_unit_tests, entrypoint: column_label, tests: [{args: [1], expected: A}, {args: [26], expected: Z}, {args: [27], expected: AA}, {args: [52], expected: AZ}]}}
  - {id: code-04, domain: software_coding, task_family: alternating_total, difficulty: foundational, semantic_task: "Implement alternating_total(values). Add values at even indexes and subtract values at odd indexes, returning zero for an empty list.", evaluator: {type: python_unit_tests, entrypoint: alternating_total, tests: [{args: [[3, -1, 4]], expected: 8}, {args: [[5, 2, 7, 1]], expected: 9}, {args: [[],], expected: 0}]}}
  - {id: code-05, domain: software_coding, task_family: transition_positions, difficulty: foundational, semantic_task: "Implement transition_positions(text). Return the indexes i where text[i] differs from text[i-1], in increasing order.", evaluator: {type: python_unit_tests, entrypoint: transition_positions, tests: [{args: ["aaabbcaaaa"], expected: [3, 5, 6]}, {args: [""], expected: []}]}}
  - {id: code-06, domain: software_coding, task_family: one_level_flatten, difficulty: foundational, semantic_task: "Implement flatten_once(groups). Concatenate the inner lists from left to right into a new list.", evaluator: {type: python_unit_tests, entrypoint: flatten_once, tests: [{args: [[[1, 2], [], [3]]], expected: [1, 2, 3]}, {args: [[]], expected: []}]}}
  - {id: code-07, domain: software_coding, task_family: padded_zip, difficulty: foundational, semantic_task: "Implement zip_fill(left, right, fill). Return a new list of two-item lists of length max(len(left),len(right)); use the item at each zero-based position or fill when that side is exhausted.", evaluator: {type: python_unit_tests, entrypoint: zip_fill, tests: [{args: [[1, 2, 3], ["a"], null], expected: [[1, a], [2, null], [3, null]]}, {args: [[], [4, 5], 0], expected: [[0, 4], [0, 5]]}]}}
  - {id: code-08, domain: software_coding, task_family: sign_label, difficulty: foundational, semantic_task: "Implement sign_label(value). Return negative for values below zero, zero for zero, and positive for values above zero.", evaluator: {type: python_unit_tests, entrypoint: sign_label, tests: [{args: [-4], expected: negative}, {args: [0], expected: zero}, {args: [9], expected: positive}]}}
  - {id: code-09, domain: software_coding, task_family: seconds_decomposition, difficulty: foundational, semantic_task: "Implement split_seconds(total). For a nonnegative integer total, return {hours: integer, minutes: integer, seconds: integer}; use quotient/remainder decomposition with 60 seconds per minute and 60 minutes per hour.", evaluator: {type: python_unit_tests, entrypoint: split_seconds, tests: [{args: [0], expected: {hours: 0, minutes: 0, seconds: 0}}, {args: [3661], expected: {hours: 1, minutes: 1, seconds: 1}}, {args: [86399], expected: {hours: 23, minutes: 59, seconds: 59}}]}}
  - {id: code-10, domain: software_coding, task_family: median_of_three, difficulty: foundational, semantic_task: "Implement middle_value(a, b, c). Return the middle value without sorting a caller-owned collection.", evaluator: {type: python_unit_tests, entrypoint: middle_value, tests: [{args: [9, 2, 5], expected: 5}, {args: [-1, -7, -3], expected: -3}]}}

  - {id: code-11, domain: software_coding, task_family: line_field_parser, difficulty: intermediate, semantic_task: "Implement parse_fields(text). For each nonempty line containing the first '=' character, trim the key and value around it and store them in a dictionary; ignore empty or '='-free lines, and let later lines replace earlier values for the same key.", evaluator: {type: python_unit_tests, entrypoint: parse_fields, tests: [{args: ["a=1\n b = two\na=3"], expected: {a: "3", b: two}}, {args: ["\n"], expected: {}}]}}
  - {id: code-12, domain: software_coding, task_family: distinct_prefix_counts, difficulty: intermediate, semantic_task: "Implement distinct_prefix_counts(values). Return how many distinct values have appeared after each successive item.", evaluator: {type: python_unit_tests, entrypoint: distinct_prefix_counts, tests: [{args: [[3, 1, 3, 2, 1]], expected: [1, 2, 2, 3, 3]}, {args: [[],], expected: []}]}}
