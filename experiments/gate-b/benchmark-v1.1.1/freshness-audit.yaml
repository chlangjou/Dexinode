schema_version: 1
benchmark_version: gate-b-orchestration-v1.1.1
revision:
  inherited_structural_audit: experiments/gate-b/benchmark-v1.1.0/freshness-audit.yaml
  structural_case_constructions_unchanged: true
  coding_wording_only_remediation: true
  router_revision: experiments/gate-b/router-v2/
comparison_scope:
  definitions_only: true
  compared_gate_a_files: [experiments/gate-a/benchmark-v1.1.0/cases/math.yaml, experiments/gate-a/benchmark-v1.2.2/cases/math.yaml, experiments/gate-a/benchmark-v1.1.0/cases/coding.yaml, experiments/gate-a/benchmark-v1.2.2/cases/coding.yaml]
  gate_a_per_case_results_read: false
  gate_a_raw_outputs_read: false
exact_overlap:
  prompt_text:
    current_field: semantic_task
    gate_a_field: prompt
    count: 0
    status: PASS
    interpretation: "No v1.1.0 semantic task is an exact Gate A prompt string."
  expected_oracle:
    comparison_key: "expected type plus normalized expected value"
    gate_a_v1_1_0_count: 8
    gate_a_v1_2_2_count: 13
    union_count: 21
    denominator: 48
    status: PASS
    interpretation: "These are repeated scalar values such as 8 or 10, not reused answer-bearing case instances; no current prompt/oracle pair is copied."
  numeric_constants:
    method: "Deterministic comparison of decimal numeric tokens in each Math semantic task against Gate A Math definitions."
    cases_with_any_shared_token: 34
    denominator: 48
    status: PASS
    interpretation: "Small generic numerals occur in unrelated fresh constructions; shared tokens do not establish structural reuse. Case-level structural review below is authoritative."
  coding_semantic_task_text_overlap: 0
  coding_entrypoint_overlap: 0
  coding_entrypoint_method: "Exact comparison of all 48 current evaluator entrypoint names against Gate A v1.1.0 and v1.2.2 evaluator entrypoint names."
  external_copying: false
  contamination_absence_claimed: false
manual_structural_review:
  method: "A reviewer compared each fresh definition with Gate A Math/Coding case skeletons, checking construction, required reasoning path, and role of constants. PASS means not a one-to-one positional mirror, constant substitution, or near-isomorphic instance."
  math_result: 48/48 PASS
  coding_result: 48/48 PASS
  positional_mirroring: PASS
  positional_statement: "The Math order is grouped by new construction families (numeric representation/statistics/probability/geometry/advanced discrete analysis), not the Gate A order; the Coding order follows a separate new API inventory."
math_cases:
