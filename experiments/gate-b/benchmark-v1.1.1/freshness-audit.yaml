  - {case_id: math-05, broad_skill_family: weighted_statistics, not_simple_transformation_of_gate_a: true, review_basis: "Weighted mean combines three observations and weights; no Gate A case has this construction."}
  - {case_id: math-06, broad_skill_family: unit_conversion_rate, not_simple_transformation_of_gate_a: true, review_basis: "A decimal unit-rate reduction is not a substituted fraction addition/division case."}
