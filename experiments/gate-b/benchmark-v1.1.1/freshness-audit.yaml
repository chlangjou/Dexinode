  - {case_id: math-02, broad_skill_family: periodic_decimal_reasoning, not_simple_transformation_of_gate_a: true, review_basis: "Repeating-decimal conversion uses an infinite-period identity, not a Gate A fraction operation with new operands."}
  - {case_id: math-03, broad_skill_family: analog_clock_geometry, not_simple_transformation_of_gate_a: true, review_basis: "Clock-hand angular velocities are a new physical geometry construction."}
