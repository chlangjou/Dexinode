cases:
  - id: math-01
    domain: mathematics
    skill_axis: mathematics
    difficulty: foundational
    prompt: >-
      Solve for x in the equation 7x - 13 = 50. Return one line exactly in
      the form ANSWER: <integer>.
    expected:
      type: integer
      value: 9
    scoring_rule: exact_integer

  - id: math-02
    domain: mathematics
    skill_axis: mathematics
    difficulty: intermediate
    prompt: >-
      Solve the system 2x + 3y = 19 and x - y = 2. Return one line exactly in
      the form ANSWER: {"x": <integer>, "y": <integer>} with the keys in that
      order.
    expected:
      type: json_object
      value: {x: 5, y: 3}
    scoring_rule: exact_json_object

  - id: math-03
