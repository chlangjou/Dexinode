        revision_source: "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct/tree/c03e6d358207e414f1eca0bb1891e29f1db0e242"
        parameter_count: 7.61B
        parameter_count_non_embedding: 6.53B
