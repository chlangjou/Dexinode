candidate_sets:
  - id: qwen2.5-7b-instruct-math-coder
    family: Qwen2.5
    generation: "Qwen2.5 generation (2024 release)"
    rationale: >-
      This set contains one general-purpose instruction checkpoint and two
      official Qwen specialist checkpoints at the same nominal 7B size. The
      public model trees trace all three checkpoints to Qwen/Qwen2.5-7B, and
      the general, Math, and Coder model cards expose the same Qwen2 causal
      architecture dimensions and Apache-2.0 licensing. The specialists make
      two distinguishable claimed domains available: mathematics and coding.
    eligibility_summary:
      general_models: 1
      specialist_models: 2
      skill_domains:
        - mathematics
        - software_coding
      common_foundation: Qwen/Qwen2.5-7B
      nominal_parameter_count: 7.61B
      architecture: Qwen2ForCausalLM
      common_architecture_dimensions:
        hidden_size: 3584
        layers: 28
        attention_heads: 28
        key_value_heads: 4
        vocabulary_size: 152064
        tensor_type: bfloat16
      license: Apache-2.0
      runtime_feasibility: conditional
      runtime_summary: >-
        Published BF16 artifacts are approximately 15.2 GB per checkpoint.
        They fit in the current host's RAM for CPU/offload execution, but no
        usable CUDA GPU is available and CPU throughput has not been measured.
        Public quantized derivatives exist, but A2 must choose one identical
        quantization policy for every model and record the exact artifacts.
    general_baseline:
      id: Qwen/Qwen2.5-7B-Instruct
      source: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct"
      revision: a09a35458c702b33eeacc393d103063234e8bc28
      revision_source: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct/tree/a09a35458c702b33eeacc393d103063234e8bc28"
      parameter_count: 7.61B
      parameter_count_non_embedding: 6.53B
      base_family: Qwen2.5
      generation: "Qwen2.5 generation"
      base_checkpoint: Qwen/Qwen2.5-7B
      license: Apache-2.0
      license_source: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct/blob/a09a35458c702b33eeacc393d103063234e8bc28/LICENSE"
      runtime_feasibility: conditional
      runtime_details: >-
        The model tree reports approximately 15.2 GB of BF16 repository
        weights. The current host has sufficient system RAM for CPU/offload
        execution, but no usable CUDA GPU was detected.
      claimed_skill: general-purpose
      claim_evidence:
        - source: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct"
          observation: "Official card describes an instruction-tuned Qwen2.5 model rather than a domain-specific variant."
        - source: "https://qwenlm.github.io/blog/qwen2.5/"
          observation: "Qwen announces Qwen2.5 as the general model line alongside separate Coder and Math expert lines."
      lineage_confidence: high
      lineage_evidence:
        - source: "https://huggingface.co/Qwen/Qwen2.5-7B-Instruct"
          observation: "Model tree lists Qwen/Qwen2.5-7B as the base model."
      comparability_concerns:
        - "The baseline and specialists all receive instruction/post-training, but their post-training data and objectives differ by design."
        - "Tokenizer and chat-template identity is plausible from the shared vocabulary/config dimensions but not independently diffed; verify in A2."
        - "The baseline exposes a 131072-token sliding-window configuration; benchmark prompts must not give it an advantage over the Math checkpoint's shorter context."

    specialists:
