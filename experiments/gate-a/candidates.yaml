        source: "https://huggingface.co/Qwen/Qwen2.5-Math-7B-Instruct"
        revision: ef9926d75ab1d54532f6a30dd5e760355eb9aa4d
        revision_source: "https://huggingface.co/Qwen/Qwen2.5-Math-7B-Instruct/tree/ef9926d75ab1d54532f6a30dd5e760355eb9aa4d"
        parameter_count: "7.61B nominal; HF UI rounds this repository to 8B"
        parameter_count_non_embedding: "Not stated in the card; same 7B Qwen2 dimensions as the baseline, to verify from the index/config at A2"
        base_family: Qwen2.5
        generation: "Qwen2.5-Math generation"
        base_checkpoint: Qwen/Qwen2.5-7B
        license: Apache-2.0
        license_source: "https://huggingface.co/Qwen/Qwen2.5-Math-7B-Instruct/blob/ef9926d75ab1d54532f6a30dd5e760355eb9aa4d/LICENSE"
        runtime_feasibility: conditional
        runtime_details: >-
          The official card provides Transformers/vLLM/SGLang loading paths;
          the current host can hold the approximately 15 GB BF16-scale model
          in system RAM, but CPU throughput and any quantized artifact remain
          untested.
        claimed_skill: mathematics
        claim_evidence:
          - source: "https://huggingface.co/Qwen/Qwen2.5-Math-7B-Instruct"
            observation: "Official card says Qwen2.5-Math mainly supports English and Chinese mathematics and recommends it for math problems."
          - source: "https://qwenlm.github.io/blog/qwen2.5-math/"
            observation: "Qwen describes math-specific pretraining and post-training, CoT/TIR support, and releases a 7B instruction model."
        lineage_confidence: high
        lineage_evidence:
          - source: "https://huggingface.co/Qwen/Qwen2.5-Math-7B-Instruct"
            observation: "Model tree lists Qwen/Qwen2.5-7B and Qwen/Qwen2.5-Math-7B in its lineage."
          - source: "https://qwenlm.github.io/blog/qwen2.5-math/"
            observation: "Qwen states that Qwen2.5-Math uses the Qwen2.5 series base model for parameter initialization."
        comparability_concerns:
          - "The published Math config uses max_position_embeddings/sliding_window 4096, unlike the general and Coder configs' 131072-token window; this is a material context-capacity confounder."
          - "The specialist was additionally pretrained and post-trained on math-specific data, including tool-integrated reasoning; formal evaluation must define whether external tools are disallowed or part of the model policy."
          - "The exact parameter total is inferred from the shared 7B architecture and rounded HF display; verify from the immutable revision before A2."
          - "The model card reports contamination analysis for math data; benchmark contamination and overlap still require a separate A3 treatment."

