        generation: "Qwen2.5-Coder generation"
        base_checkpoint: Qwen/Qwen2.5-7B
        license: Apache-2.0
        license_source: "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct/blob/c03e6d358207e414f1eca0bb1891e29f1db0e242/LICENSE"
        runtime_feasibility: conditional
        runtime_details: >-
          The model tree reports approximately 15.2 GB of BF16 repository
          weights. The current host has sufficient system RAM for CPU/offload
          execution, but no usable CUDA GPU was detected.
        claimed_skill: software_coding
        claim_evidence:
          - source: "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct"
            observation: "Official card calls this a code-specific Qwen2.5-Coder model and exposes code-related tags."
          - source: "https://qwenlm.github.io/blog/qwen2.5-coder-family/"
            observation: "Qwen describes Qwen2.5-Coder as dedicated to open CodeLLMs and reports a 7B Apache-2.0 variant."
        lineage_confidence: high
        lineage_evidence:
          - source: "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct"
            observation: "Model tree lists Qwen/Qwen2.5-7B and Qwen/Qwen2.5-Coder-7B in its lineage."
          - source: "https://arxiv.org/abs/2409.12186"
            observation: "Technical report describes Qwen2.5-Coder as built upon the Qwen2.5 architecture and continued-pretrained on code data."
        comparability_concerns:
          - "The specialist received continued pretraining on a large code-heavy corpus and code-focused post-training, so gains may reflect both specialization and additional/domain-weighted training."
          - "The model retains general and math capabilities according to its technical report; coding advantage must be compared against the full cross-skill profile rather than coding score alone."
          - "Tokenizer/chat-template identity and exact runtime behavior remain to be verified in A2."

    set_level_confounders:
      - "All three are instruction-tuned checkpoints, but the specialists have materially different domain-weighted training pipelines; this is the intended specialization contrast, not a controlled single-variable intervention."
      - "The Math checkpoint's 4K context limit is materially shorter than the other two checkpoints' 131K configuration. A fair benchmark may need to constrain all cases to the Math limit, subject to human approval in A2/A3."
      - "The public model cards expose different Transformers versions in config metadata (baseline 4.43.1, Math 4.43.1, Coder 4.44.0); A2 must pin one compatible runtime and record any required model-specific exceptions."
      - "The current host has no usable GPU, so CPU-only execution may be slow. Runtime feasibility is conditional, not experimentally demonstrated."
      - "Math and coding benchmark contamination and training-data overlap are unresolved until benchmark construction and freeze."
    recommendation: advance-to-A2-eligibility-review

