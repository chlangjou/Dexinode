validation_scope: all_48_mathematics_cases
selected_model_used: false
llm_judge_used: false

methodology:
  implementation: >-
    Independent Python standard-library calculations using exact integer
    arithmetic, fractions.Fraction, direct bounded enumeration, recurrences,
    inclusion-exclusion, and exact matrix/vector or number-theory identities.
    The case file was parsed only to compare its frozen expected values with
    the independently recomputed values; no model output was involved.
  rational_policy: >-
    Every rational recomputation uses Fraction and is compared in reduced,
    denominator-positive form.
  enumeration_policy: >-
    Bounded combinatorial, lattice, partition, Pell, and optimization cases
    use exhaustive standard-library enumeration over the mathematically stated
    finite domain where listed.
  pass_definition: >-
    PASS requires the proposed v1.2.2 expected value, after type-appropriate
    normalization, to equal the independent recomputation.

summary:
  total_cases: 48
  passed: 48
  failed: 0
  result: PASS

oracle_corrections:
  - case_id: math-23
    v1_2_1_expected: "1/4"
    v1_2_2_expected: "1/3"
    reason: >-
      Ordered distinct pairs total 9*8=72. Residue classes modulo 3 each
      contain three digits; favorable ordered pairs are 3*2 + 3*3 + 3*3 = 24,
      so the reduced probability is 24/72=1/3.
  - case_id: math-30
    v1_2_1_expected: 432
    v1_2_2_expected: 240
    reason: >-
      Surjections from five labeled balls to four labeled boxes are counted by
      4^5 - C(4,1)3^5 + C(4,2)2^5 - C(4,3)1^5 = 1024-972+192-4=240.
  - case_id: math-37
    v1_2_1_expected: "63/665"
    v1_2_2_expected: "9/95"
    reason: >-
      The conditional probability is (2^6-1)/(3^6-2^6)=63/665. The frozen
      prompt requires a reduced fraction, and gcd(63,665)=7, so the canonical
      reduced value is 9/95.

