  known_exact_overlap: "No v1.1 Math prompt or exact expected oracle intentionally reused; common mathematical vocabulary and numeric literals can overlap."
  residual_risk: >-
    The benchmark uses common mathematical structures and standard programming
    algorithms, so related examples may exist in pretraining data or
    educational material. Structural review reduces reuse of the observed
    v1.1 skeletons but does not establish contamination absence.
  contamination_check_performed: false
  difficulty_calibration_from_selected_models: false
  mitigations:
