    The benchmark uses common mathematical structures and standard programming
    algorithms, so related examples may exist in pretraining data or
    educational material. Fresh constants, mixed compositions, and edge cases
    reduce but do not eliminate exact or semantic overlap risk.
  contamination_check_performed: false
