  coding_judge_v2_policy: {reused: true, behavior_changed: false}
  software_coding_case_set: {reused: true, byte_identical: true}
  genuine_implementation_bug_found: false

semantic_handoff:
  primary_metric: deterministic_task_semantics
  strict_interface_is_separate: true
  mathematics:
    contract: "One canonical ANSWER candidate or one conventional boxed candidate under the expected type grammar; reasoning may precede the final."
    types: [integer, rational, structured_object]
    expected_value_guided_extraction: false
    conflicting_candidates_rejected: true
  software_coding:
    contract: "Python 3.10 implementation with prose permitted; deterministic AST selection of the first qualifying Python/unlabeled fenced block."
    execution_during_extraction: false
    source_execution_boundary: approved_judge_v2_only

scoring:
  file: scoring.yaml
  adapter_directory: adapter/
  deterministic: true
  llm_judge: false
  case_weights: equal
  primary_semantic_score_excludes_strict_interface: true
  strict_metrics: [math_canonical_answer_contract, coding_single_clean_source_block]
  gate_acceptance_reference: gates/gate-a-specialization/acceptance.yaml
  gate_acceptance_thresholds_modified: false
  raw_response_preservation: required

provenance:
  remediation_design: >-
    The remediation design was informed by the observed v1.1 interface
    confounder.
  selected_model_raw_response_used_as_adapter_fixture: false
  expected_value_used_to_choose_generated_candidate: false
  v1_2_1_case_oracle_or_difficulty_tuned_using_selected_model_performance: false
  selected_model_executed_during_v1_2_1_construction: false
  source_selection: >-
    Fresh self-authored mathematics instances were created for this structural
    freshness revision. The accepted v1.2.0 coding instances were reused
    unchanged. No external dataset, public answer key, or selected-model
    output was used as a fixture.
  external_dataset_assets: none
  external_sources_copied: none
  benchmark_content_license: "No separate project license has been chosen; repository owner review is required before external redistribution."

contamination_and_validity:
